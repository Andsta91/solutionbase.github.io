name: 🔔 Notify Teams - New Solutions

on:
  push:
    paths:
      - 'solutions/**'
    branches:
      - main
      - master

jobs:
  notify-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          if [ ${{ github.event.before }} == "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=A $(git rev-parse HEAD) | grep '^solutions/' > /tmp/changed_files.txt || echo "" > /tmp/changed_files.txt
          else
            git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '^solutions/' > /tmp/changed_files.txt || echo "" > /tmp/changed_files.txt
          fi

      - name: Extract solution details
        id: solution
        run: |
          CHANGED=$(cat /tmp/changed_files.txt)
          
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          FIRST_FILE=$(echo "$CHANGED" | head -1)
          SOLUTION_PATH=$(echo "$FIRST_FILE" | cut -d'/' -f1-2)
          SOLUTION_NAME=$(echo "$SOLUTION_PATH" | cut -d'/' -f2)
          FILE_COUNT=$(echo "$CHANGED" | wc -l)
          
          if [[ "$SOLUTION_NAME" == *"power-app"* ]] || [[ "$SOLUTION_NAME" == *"app"* ]]; then
            SOLUTION_TYPE="Power Apps"
            THEME_COLOR="0078D4"
          elif [[ "$SOLUTION_NAME" == *"automate"* ]] || [[ "$SOLUTION_NAME" == *"flow"* ]]; then
            SOLUTION_TYPE="Power Automate"
            THEME_COLOR="00A4EF"
          elif [[ "$SOLUTION_NAME" == *"sharepoint"* ]] || [[ "$SOLUTION_NAME" == *"spfx"* ]]; then
            SOLUTION_TYPE="SharePoint"
            THEME_COLOR="0078D4"
          elif [[ "$SOLUTION_NAME" == *"powershell"* ]] || [[ "$SOLUTION_NAME" == *"ps"* ]]; then
            SOLUTION_TYPE="PowerShell"
            THEME_COLOR="017CFF"
          else
            SOLUTION_TYPE="Power Platform Solution"
            THEME_COLOR="0078D4"
          fi
          
          echo "solution_name=$SOLUTION_NAME" >> $GITHUB_OUTPUT
          echo "solution_type=$SOLUTION_TYPE" >> $GITHUB_OUTPUT
          echo "theme_color=$THEME_COLOR" >> $GITHUB_OUTPUT
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "commit_author=${{ github.event.head_commit.author.name }}" >> $GITHUB_OUTPUT
          echo "commit_msg=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
          echo "commit_url=${{ github.event.head_commit.url }}" >> $GITHUB_OUTPUT

      - name: Send Teams Notification
        if: steps.solution.outputs.has_changes == 'true'
        env:
          SOLUTION_NAME: ${{ steps.solution.outputs.solution_name }}
          SOLUTION_TYPE: ${{ steps.solution.outputs.solution_type }}
          THEME_COLOR: ${{ steps.solution.outputs.theme_color }}
          FILE_COUNT: ${{ steps.solution.outputs.file_count }}
          AUTHOR: ${{ steps.solution.outputs.commit_author }}
          COMMIT_MSG: ${{ steps.solution.outputs.commit_msg }}
          COMMIT_URL: ${{ steps.solution.outputs.commit_url }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cat > /tmp/teams_payload.json << 'PAYLOAD_EOF'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "New Solution Added",
            "themeColor": "THEME_COLOR_PLACEHOLDER",
            "title": "🆕 New Solution Added to SolutionBase",
            "sections": [
              {
                "activityTitle": "SOLUTION_TYPE_PLACEHOLDER",
                "activitySubtitle": "SOLUTION_NAME_PLACEHOLDER",
                "facts": [
                  {
                    "name": "📦 Solution Name:",
                    "value": "SOLUTION_NAME_PLACEHOLDER"
                  },
                  {
                    "name": "🏷️ Type:",
                    "value": "SOLUTION_TYPE_PLACEHOLDER"
                  },
                  {
                    "name": "👤 Added By:",
                    "value": "AUTHOR_PLACEHOLDER"
                  },
                  {
                    "name": "📂 Files Changed:",
                    "value": "FILE_COUNT_PLACEHOLDER file(s)"
                  },
                  {
                    "name": "💬 Commit Message:",
                    "value": "COMMIT_MSG_PLACEHOLDER"
                  },
                  {
                    "name": "📍 Repository:",
                    "value": "REPO_PLACEHOLDER"
                  }
                ],
                "markdown": true
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "📖 View Solution",
                "targets": [
                  {
                    "os": "default",
                    "uri": "https://github.com/REPO_PLACEHOLDER/tree/BRANCH_PLACEHOLDER/solutions/SOLUTION_NAME_PLACEHOLDER"
                  }
                ]
              },
              {
                "@type": "OpenUri",
                "name": "🔗 View Commit",
                "targets": [
                  {
                    "os": "default",
                    "uri": "COMMIT_URL_PLACEHOLDER"
                  }
                ]
              }
            ]
          }
          PAYLOAD_EOF

          # Replace placeholders
          sed -i "s|THEME_COLOR_PLACEHOLDER|$THEME_COLOR|g" /tmp/teams_payload.json
          sed -i "s|SOLUTION_TYPE_PLACEHOLDER|$SOLUTION_TYPE|g" /tmp/teams_payload.json
          sed -i "s|SOLUTION_NAME_PLACEHOLDER|$SOLUTION_NAME|g" /tmp/teams_payload.json
          sed -i "s|AUTHOR_PLACEHOLDER|$AUTHOR|g" /tmp/teams_payload.json
          sed -i "s|FILE_COUNT_PLACEHOLDER|$FILE_COUNT|g" /tmp/teams_payload.json
          sed -i "s|COMMIT_MSG_PLACEHOLDER|$COMMIT_MSG|g" /tmp/teams_payload.json
          sed -i "s|REPO_PLACEHOLDER|$REPO|g" /tmp/teams_payload.json
          sed -i "s|BRANCH_PLACEHOLDER|$BRANCH|g" /tmp/teams_payload.json
          sed -i "s|COMMIT_URL_PLACEHOLDER|$COMMIT_URL|g" /tmp/teams_payload.json

          # Send to Teams
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d @/tmp/teams_payload.json

      - name: Log notification status
        if: always()
        run: echo "Teams notification workflow completed"
