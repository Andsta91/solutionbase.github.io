name: Auto-publish Approved Solution

on:
  issues:
    types: [labeled]

jobs:
  create-pull-request:
    # Fires only when 'approved' label is added to a 'new-solution' issue
    if: |
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'new-solution')

    runs-on: ubuntu-latest

    permissions:
      contents: write      # needed to push a branch
      pull-requests: write # needed to open a PR
      issues: write        # needed to comment on the issue

    steps:

      # ── 1. Check out the repo ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Parse issue → generate JSON → patch solutions.json ──
      - name: Parse issue and patch solutions.json
        uses: actions/github-script@v7
        id: patch
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            const issueNumber = context.payload.issue.number;
            const issueTitle  = context.payload.issue.title;

            // ── Helper: pull a field value out of the GitHub issue form body ──
            function extract(label) {
              const regex = new RegExp(
                `### ${label}\\s*\\n+([\\s\\S]*?)(?=\\n###|$)`, 'i'
              );
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            // ── Pull every field ──
            const title      = extract('Solution Title') || issueTitle.replace('[Solution]','').trim();
            const tool       = extract('Primary Tool / Category');
            const difficulty = extract('Difficulty Level');
            const status     = extract('Status');
            const version    = extract('Version') || '1.0.0';
            const desc       = extract('Short Description').replace(/\n/g,' ');
            const icon       = extract('Icon \\(single emoji\\)') || '📦';
            const color      = extract('Accent Color \\(hex\\)')  || '#0078d4';
            const repoUrl    = extract('GitHub Repository URL');
            const pkgUrl     = extract('Download / Package URL');
            const tagsRaw    = extract('Tags');
            const featRaw    = extract('Key Features');
            const compRaw    = extract('Solution Components');
            const prereqRaw  = extract('Prerequisites');
            const notesRaw   = extract('Additional Notes');

            // ── Process arrays ──
            const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean).slice(0, 6);

            const features = featRaw.split('\n')
              .map(l => l.replace(/^[-*]\s*/,'').trim()).filter(Boolean);

            const components = compRaw.split('\n')
              .map(l => l.replace(/^[-*]\s*/,'').trim()).filter(Boolean)
              .map(line => {
                const parts = line.split('|').map(p => p.trim());
                return parts.length >= 3
                  ? { type: parts[0], name: parts[1], description: parts[2] }
                  : { type: 'Unknown', name: line, description: '' };
              });

            const prerequisites = prereqRaw.split('\n')
              .map(l => l.replace(/^[-*]\s*/,'').trim()).filter(Boolean);

            // ── Build a URL-safe slug ──
            const id = title.toLowerCase()
              .replace(/[^a-z0-9\s-]/g,'')
              .replace(/\s+/g,'-')
              .replace(/-+/g,'-')
              .slice(0, 50);

            const today = new Date().toISOString().split('T')[0];

            // ── Build the solution object ──
            const solution = {
              id,
              title,
              tool,
              tags,
              difficulty,
              status,
              version,
              lastUpdated: today,
              stars: 0,
              downloads: 0,
              featured: false,
              icon,
              color,
              description: desc,
              readmePath:  `solutions/${id}/README.md`,
              packagePath: pkgUrl,
              githubRepo:  repoUrl,
              features,
              components,
              prerequisites,
              issueRef: issueNumber
            };

            // ── Read, append, write solutions.json ──
            const jsonPath = 'data/solutions.json';
            const existing = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));

            // Guard against duplicate IDs
            if (existing.some(s => s.id === id)) {
              core.setOutput('skipped', 'true');
              core.setOutput('skip_reason', `Solution with id "${id}" already exists.`);
              return;
            }

            existing.push(solution);
            fs.writeFileSync(jsonPath, JSON.stringify(existing, null, 2) + '\n');

            core.setOutput('solution_id',    id);
            core.setOutput('solution_title', title);
            core.setOutput('issue_number',   String(issueNumber));
            core.setOutput('skipped',        'false');

      # ── 3. Commit the changed file to a new branch ──
      - name: Commit patched solutions.json
        if: steps.patch.outputs.skipped == 'false'
        run: |
          git config user.name  "SolutionBase Bot"
          git config user.email "bot@solutionbase"
          BRANCH="solution/add-${{ steps.patch.outputs.solution_id }}-issue-${{ steps.patch.outputs.issue_number }}"
          git checkout -b "$BRANCH"
          git add data/solutions.json
          git commit -m "feat: add solution '${{ steps.patch.outputs.solution_title }}' (closes #${{ steps.patch.outputs.issue_number }})"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # ── 4. Open a Pull Request ─────────────────────
      - name: Open Pull Request
        if: steps.patch.outputs.skipped == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `✅ Add solution: ${{ steps.patch.outputs.solution_title }}`,
              head:  process.env.BRANCH,
              base:  'main',
              body: [
                `## New Solution: ${{ steps.patch.outputs.solution_title }}`,
                '',
                `Automatically generated from issue #${{ steps.patch.outputs.issue_number }}.`,
                '',
                '### What this PR does',
                '- Appends the new solution entry to `data/solutions.json`',
                '- **Does NOT** create the `solutions/<id>/` folder — the submitter must supply their own `README.md` and `package.zip`',
                '',
                '### Before merging, verify',
                '- [ ] The JSON entry looks correct (title, description, tags, links)',
                '- [ ] The `githubRepo` link is real and publicly accessible',
                '- [ ] The `packagePath` download link works',
                `- [ ] Issue #${{ steps.patch.outputs.issue_number }} has a `solutions/${{ steps.patch.outputs.solution_id }}/README.md\` attached or linked`,
                '',
                `Closes #${{ steps.patch.outputs.issue_number }}`
              ].join('\n')
            });

            // Post link back to the original issue
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: ${{ steps.patch.outputs.issue_number }},
              body: [
                '## 🚀 Pull Request Created',
                '',
                `A PR has been opened automatically to add this solution to the library:`,
                `**[#${pr.number} — ${pr.title}](${pr.html_url})**`,
                '',
                'Once you review and merge the PR, the solution will appear on the site immediately.',
                '',
                '_No manual JSON editing required._'
              ].join('\n')
            });

            // Add label to issue
            await github.rest.issues.addLabels({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: ${{ steps.patch.outputs.issue_number }},
              labels:       ['pr-opened']
            });

      # ── 5. Handle duplicate / skip case ───────────
      - name: Comment on duplicate
        if: steps.patch.outputs.skipped == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: ${{ steps.patch.outputs.issue_number }},
              body: [
                '## ⚠️ Duplicate ID Detected',
                '',
                `A solution with this ID already exists in \`data/solutions.json\`.`,
                '',
                'Reason: `${{ steps.patch.outputs.skip_reason }}`',
                '',
                'Please edit the issue title to use a unique name, then remove and re-add the `approved` label to re-run.'
              ].join('\n')
            });
