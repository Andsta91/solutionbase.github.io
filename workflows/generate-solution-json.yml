name: Generate Solution JSON

on:
  issues:
    types: [labeled]

jobs:
  generate-json:
    # Only run when the 'approved' label is added to a new-solution issue
    if: |
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'new-solution')

    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Parse issue and generate JSON snippet
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            const issueNumber = context.payload.issue.number;
            const issueTitle = context.payload.issue.title;

            // ── Helper: extract a field value from the issue form body ──
            function extract(label) {
              const regex = new RegExp(`### ${label}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            // ── Parse fields ──
            const title     = extract('Solution Title') || issueTitle.replace('[Solution]', '').trim();
            const tool      = extract('Primary Tool / Category');
            const difficulty= extract('Difficulty Level');
            const status    = extract('Status');
            const version   = extract('Version') || '1.0.0';
            const desc      = extract('Short Description').replace(/\n/g, ' ');
            const icon      = extract('Icon \\(single emoji\\)') || '📦';
            const color     = extract('Accent Color \\(hex\\)') || '#0078d4';
            const repoUrl   = extract('GitHub Repository URL');
            const pkgUrl    = extract('Download / Package URL');
            const tagsRaw   = extract('Tags');
            const featRaw   = extract('Key Features');
            const compRaw   = extract('Solution Components');
            const prereqRaw = extract('Prerequisites');

            // ── Process arrays ──
            const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean).slice(0, 6);

            const features = featRaw.split('\n')
              .map(l => l.replace(/^[-*]\s*/, '').trim())
              .filter(Boolean);

            const components = compRaw.split('\n')
              .map(l => l.replace(/^[-*]\s*/, '').trim())
              .filter(Boolean)
              .map(line => {
                const parts = line.split('|').map(p => p.trim());
                return parts.length >= 3
                  ? { type: parts[0], name: parts[1], description: parts[2] }
                  : { type: 'Unknown', name: line, description: '' };
              });

            const prerequisites = prereqRaw.split('\n')
              .map(l => l.replace(/^[-*]\s*/, '').trim())
              .filter(Boolean);

            // ── Build slug ID from title ──
            const id = title.toLowerCase()
              .replace(/[^a-z0-9\s-]/g, '')
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-')
              .slice(0, 50);

            const today = new Date().toISOString().split('T')[0];

            // ── Build the JSON object ──
            const solution = {
              id,
              title,
              tool,
              tags,
              difficulty,
              status,
              version,
              lastUpdated: today,
              stars: 0,
              downloads: 0,
              featured: false,
              icon,
              color,
              description: desc,
              readmePath: `solutions/${id}/README.md`,
              packagePath: pkgUrl,
              githubRepo: repoUrl,
              features,
              components,
              prerequisites
            };

            const json = JSON.stringify(solution, null, 2);

            // ── Post as comment ──
            const comment = [
              '## ✅ Solution JSON Generated',
              '',
              'The issue has been approved. Copy the JSON below and add it to `data/solutions.json`:',
              '',
              '**Steps:**',
              `1. Open [\`data/solutions.json\`](https://github.com/${context.repo.owner}/${context.repo.repo}/edit/main/data/solutions.json) in the GitHub editor`,
              '2. Add a comma after the last `}` in the array',
              '3. Paste the JSON below',
              '4. Commit directly to `main`',
              '',
              `Also create the folder \`solutions/${id}/\` and add a \`README.md\` and \`package.zip\`.`,
              '',
              '```json',
              json,
              '```',
              '',
              `---`,
              `_Auto-generated from issue #${issueNumber} by the SolutionBase bot._`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            // Also add a 'json-ready' label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['json-ready']
            });

            console.log(`✅ JSON comment posted on issue #${issueNumber}`);
