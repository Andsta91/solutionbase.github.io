name: 📦 Submit a Solution
description: Submit a new solution to be added to the SolutionBase library
title: "[Solution] "
labels: ["new-solution", "pending-review"]
assignees:
  - Andsta91

body:

  - type: markdown
    attributes:
      value: |
        ## Thanks for contributing to SolutionBase! 🎉
        Fill in the details below. Once submitted, the maintainer will review your solution and add it to `data/solutions.json`. 
        The more detail you provide, the faster the review.

  # ── BASIC INFO ────────────────────────────────────

  - type: input
    id: title
    attributes:
      label: Solution Title
      description: A clear, descriptive name for your solution
      placeholder: e.g. Invoice Approval Workflow
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Primary Tool / Category
      description: Which Microsoft tool does this solution primarily use?
      options:
        - Power Apps
        - Power Automate
        - SharePoint
        - SharePoint Webparts (SPFx)
        - PowerShell
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty Level
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Has this been deployed and tested in a real environment?
      options:
        - Production Ready
        - Beta
        - Experimental
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  # ── DESCRIPTION ───────────────────────────────────

  - type: textarea
    id: description
    attributes:
      label: Short Description
      description: 2–3 sentences. What problem does this solve and for whom? This appears on the solution card.
      placeholder: A complete invoice approval solution built on Power Automate. Finance teams submit invoices through a Canvas App, which routes them through a configurable multi-step approval chain before posting to the ERP system.
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: Key Features
      description: List the main features, one per line
      placeholder: |
        Multi-step configurable approval chain
        Teams Adaptive Card approvals
        ERP integration via HTTP connector
        Audit log to SharePoint
        Automatic escalation after SLA breach
    validations:
      required: true

  # ── COMPONENTS ────────────────────────────────────

  - type: textarea
    id: components
    attributes:
      label: Solution Components
      description: |
        List each component on its own line in this format:
        `Type | Name | Description`
      placeholder: |
        Power Apps | Invoice Canvas App | Employee-facing invoice submission form
        Power Automate | Approval Orchestrator Flow | Routes invoices through approval chain
        Power Automate | SLA Monitor Flow | Scheduled escalation checker
        SharePoint | InvoiceQueue list | Stores invoice records and approval status
        Teams | Adaptive Card Templates | Inline approval cards for approvers
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: List what someone needs to deploy this, one per line
      placeholder: |
        Power Automate Premium (HTTP connector)
        Power Apps per user or per app license
        SharePoint Online
        Microsoft Teams
        ERP system with REST API
    validations:
      required: true

  # ── TAGS ──────────────────────────────────────────

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated list of tags (max 6). Used for search and filtering.
      placeholder: Approvals, SharePoint, Teams, HTTP Connector, ERP, Canvas App
    validations:
      required: true

  - type: input
    id: icon
    attributes:
      label: Icon (single emoji)
      description: One emoji that represents this solution
      placeholder: 🧾
    validations:
      required: true

  - type: input
    id: color
    attributes:
      label: Accent Color (hex)
      description: A hex color used for the solution card. Pick something that matches the category.
      placeholder: "#0078d4"
    validations:
      required: true

  # ── GITHUB LINKS ──────────────────────────────────

  - type: input
    id: github_repo
    attributes:
      label: GitHub Repository URL
      description: Where is the source code / documentation hosted?
      placeholder: https://github.com/yourusername/your-repo
    validations:
      required: true

  - type: input
    id: package_url
    attributes:
      label: Download / Package URL
      description: Direct link to download the solution package (.zip, .msapp, .sppkg, etc.)
      placeholder: https://github.com/yourusername/your-repo/releases/latest
    validations:
      required: true

  # ── DOCUMENTATION ─────────────────────────────────

  - type: checkboxes
    id: docs_checklist
    attributes:
      label: Documentation Checklist
      description: Please confirm your submission includes these
      options:
        - label: I have a README.md with installation steps
          required: true
        - label: The README includes an architecture overview
          required: true
        - label: The README lists all environment variables / configuration options
          required: true
        - label: The solution has been tested in a real Microsoft 365 environment
          required: true
        - label: The package.zip (or equivalent) is importable without modification
          required: false

  # ── EXTRA ─────────────────────────────────────────

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Anything else the reviewer should know — known limitations, GCC compatibility, special setup steps, etc.
      placeholder: Tested on commercial M365 tenant. GCC compatibility not verified. Requires ERP to have a REST API with Basic Auth.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Submission Agreement
      options:
        - label: This solution is my own work or I have permission to submit it
          required: true
        - label: I agree to license this under the MIT License
          required: true
        - label: I have read the [Contributing Guide](https://github.com/Andsta91/solutionbase.github.io/blob/main/CONTRIBUTING.md)
          required: true
