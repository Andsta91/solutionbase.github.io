<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolutionBase</title>

<link rel="stylesheet" href="./css/main.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">SolutionBase</div>

  <div class="nav">
    <a href="#">All Solutions</a>
    <a href="#">Power Apps</a>
    <a href="#">Power Automate</a>
    <a href="#">PowerShell</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <!-- LEFT: SEARCH -->
    <div class="search">
      <input type="text" id="search" placeholder="Search solutions...">
    </div>

    <!-- RIGHT: FILTERS + THEME -->
    <div class="controls">

      <select id="toolFilter">
        <option value="">All Tools</option>
        <option>Power Apps</option>
        <option>Power Automate</option>
        <option>PowerShell</option>
      </select>

      <select id="difficultyFilter">
        <option value="">All Levels</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>

      <button id="themeToggle">🌙</button>

    </div>

  </div>

  <!-- SPA RENDER TARGET -->
  <div id="app"></div>

</div>

<!-- JS -->
<script src="./js/app.js"></script>

</body>
</html>
