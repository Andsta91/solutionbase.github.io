<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolutionBase</title>
<link rel="stylesheet" href="./css/main.css">
</head>
  
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">SolutionBase</div>
  <div class="nav">
    <a href="#">All Solutions</a>
    <a href="#">Power Apps</a>
    <a href="#">Power Automate</a>
    <a href="#">PowerShell</a>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR (KEEP THIS) -->
  <div class="topbar">
    <div class="search">
      <input type="text" id="search" placeholder="Search solutions...">
    </div>
<button id="themeToggle">🌙</button>
    <div class="filters">
      <select id="toolFilter">
        <option value="">All Tools</option>
        <option>Power Apps</option>
        <option>Power Automate</option>
        <option>PowerShell</option>
      </select>

      <select id="difficultyFilter">
        <option value="">All Levels</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>
  </div>

  <!-- 🔥 THIS is where JS renders everything -->
  <div id="app"></div>

</div>

<!-- CONNECT YOUR JS -->
<script src="./js/app.js"></script>

</body>
</html>
