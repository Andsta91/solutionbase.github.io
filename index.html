<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolutionBase</title>

<style>
:root {
  --bg: #0b0f19;
  --sidebar: #0f1629;
  --card: #151c32;
  --border: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #4f9cff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: var(--sidebar);
  height: 100vh;
  padding: 20px;
  border-right: 1px solid var(--border);
}

.logo {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 30px;
}

.nav a {
  display: block;
  padding: 10px;
  color: var(--muted);
  text-decoration: none;
  border-radius: 8px;
  margin-bottom: 5px;
}

.nav a:hover {
  background: var(--card);
  color: white;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px 40px;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 30px;
}

.search {
  width: 300px;
}

.search input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #020617;
  color: white;
}

/* FILTERS */
.filters {
  display: flex;
  gap: 10px;
}

select {
  padding: 8px;
  border-radius: 8px;
  background: #020617;
  color: white;
  border: none;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 18px;
  border: 1px solid var(--border);
  transition: 0.2s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-6px);
  border-color: var(--accent);
}

.tag {
  font-size: 12px;
  color: var(--accent);
}

.title {
  font-size: 18px;
  margin: 8px 0;
}

.desc {
  font-size: 14px;
  color: var(--muted);
}

.meta {
  margin-top: 10px;
  font-size: 12px;
  color: #64748b;
}
</style>
</head>

<body>
<div id="app"></div>
<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">SolutionBase</div>
  <div class="nav">
    <a href="#">All Solutions</a>
    <a href="#">Power Apps</a>
    <a href="#">Power Automate</a>
    <a href="#">PowerShell</a>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div class="search">
      <input type="text" id="search" placeholder="Search solutions...">
    </div>

    <div class="filters">
      <select id="toolFilter">
        <option value="">All Tools</option>
        <option>Power Apps</option>
        <option>Power Automate</option>
        <option>PowerShell</option>
      </select>

      <select id="difficultyFilter">
        <option value="">All Levels</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
const solutions = [
  {
    title: "Employee Onboarding",
    desc: "Automate onboarding with approvals and notifications.",
    tool: "Power Apps",
    difficulty: "Intermediate",
    time: "30 min"
  },
  {
    title: "Invoice Approval Flow",
    desc: "Approval system with tracking and alerts.",
    tool: "Power Automate",
    difficulty: "Beginner",
    time: "15 min"
  },
  {
    title: "User Provisioning Script",
    desc: "Automated user creation and configuration.",
    tool: "PowerShell",
    difficulty: "Advanced",
    time: "45 min"
  }
];

const grid = document.getElementById("grid");

function render(list) {
  grid.innerHTML = "";
  list.forEach(s => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="tag">${s.tool}</div>
      <div class="title">${s.title}</div>
      <div class="desc">${s.desc}</div>
      <div class="meta">${s.difficulty} • ${s.time}</div>
    `;
    grid.appendChild(el);
  });
}

function filter() {
  const search = document.getElementById("search").value.toLowerCase();
  const tool = document.getElementById("toolFilter").value;
  const diff = document.getElementById("difficultyFilter").value;

  const filtered = solutions.filter(s =>
    s.title.toLowerCase().includes(search) &&
    (tool === "" || s.tool === tool) &&
    (diff === "" || s.difficulty === diff)
  );

  render(filtered);
}

document.getElementById("search").addEventListener("input", filter);
document.getElementById("toolFilter").addEventListener("change", filter);
document.getElementById("difficultyFilter").addEventListener("change", filter);

render(solutions);
</script>

</body>
</html>
